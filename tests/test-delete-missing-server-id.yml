name: Test delete mode with missing server_id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: delete
          github_token: fake-token-for-validation-test
          hcloud_token: fake-hcloud-token-for-validation-test
          name: 'my-runner'
          # server_id is intentionally omitted to trigger validation failure
      - name: Assert action failed with missing server_id in delete mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when server_id is missing in delete mode, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with missing server_id in delete mode"
