name: Test delete mode with server_id provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in delete mode with server_id (expect failure at API, not at validation)
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: delete
          github_token: fake-token-for-validation-test
          hcloud_token: fake-hcloud-token-for-validation-test
          name: test-runner
          server_id: '12345678'

      - name: Assert action failed (at API call, not at server_id validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the fake hcloud_token is rejected by the API,
          # NOT because server_id is missing or invalid (server_id=12345678 is a valid integer).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (API rejection with fake token), but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (API rejected fake token after server_id validation passed)"
