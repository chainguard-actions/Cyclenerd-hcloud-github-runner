name: "CI"

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: CI/CD Test
    # https://github.com/actions/virtual-environments/
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 🌡️ Test
        run: shellcheck *.sh
