name: Test delete mode with server_id input provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action in delete mode with a server_id and expect failure (fake token)
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: delete
          github_token: fake-github-token
          hcloud_token: fake-hcloud-token
          server_id: '12345678'
      - name: Assert action failed due to fake API token (not due to missing server_id)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when using fake tokens"
            exit 1
          fi
          echo "PASS: action correctly failed (server_id input was accepted and passed to the action)"
