name: Test delete mode with missing server_id fails with expected error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action in delete mode without server_id and expect failure
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: delete
          github_token: fake-github-token
          hcloud_token: fake-hcloud-token
          # server_id intentionally omitted
      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when delete mode is used without server_id"
            exit 1
          fi
          echo "PASS: action correctly failed when delete mode used without server_id"
