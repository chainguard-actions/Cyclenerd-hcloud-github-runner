name: Test invalid runner version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid runner version (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: create
          github_token: fake-token-for-validation-test
          hcloud_token: fake-hcloud-token-for-validation-test
          runner_version: "v2.321.0"

      - name: Assert action failed with invalid runner version format
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid runner version (with 'v' prefix), but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid runner version format"
