name: Test delete mode without server_id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in delete mode without server_id (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: delete
          github_token: fake-token-for-validation-test
          hcloud_token: fake-hcloud-token-for-validation-test
          name: test-runner

      - name: Assert action failed without server_id in delete mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when delete mode has no server_id, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when delete mode has no server_id"
