name: Test missing hcloud_token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action without hcloud_token (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: create
          github_token: fake-github-token
        env:
          GITHUB_REPOSITORY: test-owner/test-repo
      - name: Assert action failed due to missing hcloud_token
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when hcloud_token is missing"
            exit 1
          fi
          echo "PASS: action correctly failed when hcloud_token is missing"
