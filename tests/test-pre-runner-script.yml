name: Test pre_runner_script input is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with pre_runner_script input (expect failure at API, not validation)
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: create
          github_token: fake-token-for-validation-test
          hcloud_token: fake-hcloud-token-for-validation-test
          name: test-runner-pre-script
          pre_runner_script: |
            apt-get update -y
            apt-get install -y curl
      - name: Assert action failed at API stage (not at pre_runner_script validation)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (fake tokens), but it succeeded"
            exit 1
          fi
          echo "PASS: action failed as expected (at API call stage, not pre_runner_script validation)"
