name: Test create mode with pre_runner_script provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in create mode with pre_runner_script (expect failure at API, not at validation)
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: create
          github_token: fake-token-for-validation-test
          hcloud_token: fake-hcloud-token-for-validation-test
          name: test-runner
          pre_runner_script: 'apt-get install -y curl'

      - name: Assert action failed (at API call, not at pre_runner_script validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the fake github_token is rejected by the GitHub API,
          # NOT because pre_runner_script is invalid (it is accepted as-is without validation).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (API rejection with fake token), but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (API rejected fake token after pre_runner_script was accepted)"
