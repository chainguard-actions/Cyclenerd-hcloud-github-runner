name: Test invalid server name validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with invalid server name (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: create
          github_token: fake-token-for-validation-test
          hcloud_token: fake-hcloud-token-for-validation-test
          name: "invalid name with spaces!"
      - name: Assert action failed due to invalid server name
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid server name, but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid server name"
