name: Test missing github_token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action without github_token (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ""
          hcloud_token: fake-hcloud-token
          mode: create
      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when github_token is empty"
            exit 1
          fi
          echo "PASS: action correctly failed when github_token is empty"
