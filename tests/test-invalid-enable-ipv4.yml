name: Test invalid enable_ipv4 input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid enable_ipv4 value (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: create
          github_token: fake-token-for-validation-test
          hcloud_token: fake-hcloud-token-for-validation-test
          enable_ipv4: "yes"

      - name: Assert action failed with invalid enable_ipv4
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid enable_ipv4, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid enable_ipv4 value"
