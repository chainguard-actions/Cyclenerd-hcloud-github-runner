name: Test missing github_token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: create
          github_token: ''
          hcloud_token: fake-hcloud-token
        env:
          GITHUB_REPOSITORY: test-owner/test-repo
      - name: Assert action failed with missing github_token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing github_token, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with missing github_token"
