name: Test invalid enable_ipv4 input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: 'create'
          github_token: 'dummy-github-token'
          hcloud_token: 'dummy-hcloud-token'
          enable_ipv4: 'yes'
      - name: Assert action failed due to invalid enable_ipv4 value
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid enable_ipv4 value, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid enable_ipv4 value"
