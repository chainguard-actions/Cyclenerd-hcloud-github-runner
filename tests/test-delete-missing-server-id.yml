name: Test delete mode without server_id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: 'delete'
          github_token: 'dummy-github-token'
          hcloud_token: 'dummy-hcloud-token'
          name: 'test-runner'
          # server_id intentionally omitted to trigger validation failure
      - name: Assert action failed due to missing server_id in delete mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing server_id in delete mode, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with missing server_id in delete mode"
