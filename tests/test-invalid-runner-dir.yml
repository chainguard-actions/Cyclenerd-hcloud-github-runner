name: Test invalid runner_dir fails with expected error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with invalid runner_dir (trailing slash) and expect failure
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: create
          github_token: fake-github-token
          hcloud_token: fake-hcloud-token
          runner_dir: '/actions-runner/'
      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when runner_dir has a trailing slash"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid runner_dir"
