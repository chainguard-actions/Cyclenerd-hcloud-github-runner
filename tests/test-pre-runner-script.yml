name: Test create mode with pre_runner_script input provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action in create mode with pre_runner_script and expect failure (fake token)
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: create
          github_token: fake-github-token
          hcloud_token: fake-hcloud-token
          pre_runner_script: 'apt-get install -y curl'
      - name: Assert action failed due to fake API token (not due to pre_runner_script)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when using fake tokens"
            exit 1
          fi
          echo "PASS: action correctly failed (pre_runner_script input was accepted and passed to the action)"
