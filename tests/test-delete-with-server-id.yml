name: Test delete mode with server_id input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action in delete mode with server_id (expect failure at API call)
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: delete
          github_token: invalid-token-for-testing
          hcloud_token: invalid-hcloud-token-for-testing
          name: test-runner-delete
          server_id: '12345678'
      - name: Assert action failed (expected - invalid tokens)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid tokens, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected with invalid tokens when using server_id input"
