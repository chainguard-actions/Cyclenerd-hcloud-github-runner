name: Test delete mode with server_id provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: delete
          github_token: fake-token-for-validation-test
          hcloud_token: fake-hcloud-token-for-validation-test
          name: 'my-runner'
          server_id: '12345678'
      - name: Assert action failed at API stage (not at server_id validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of the fake hcloud_token (API DELETE call fails),
          # not because of server_id validation (12345678 is a valid integer).
          # Either way, the action fails — confirming server_id was accepted.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (due to fake tokens), but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: server_id input was accepted and action failed at API stage as expected"
