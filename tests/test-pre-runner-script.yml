name: Test pre_runner_script input is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: create
          github_token: fake-token-for-validation-test
          hcloud_token: fake-hcloud-token-for-validation-test
          name: 'my-runner'
          pre_runner_script: 'apt-get install -y curl'
      - name: Assert action failed at API stage (not at pre_runner_script validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of the fake tokens (API call fails),
          # not because of pre_runner_script validation (there is none).
          # Either way, the action fails — confirming pre_runner_script was accepted.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (due to fake tokens), but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: pre_runner_script input was accepted and action failed at API stage as expected"
