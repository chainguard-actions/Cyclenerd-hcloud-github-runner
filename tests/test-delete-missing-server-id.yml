name: Test delete mode with missing server_id fails validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action in delete mode without server_id (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: delete
          github_token: fake-token-for-validation-test
          hcloud_token: fake-hcloud-token-for-validation-test
          name: my-runner
      - name: Assert action failed due to missing server_id
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail in delete mode without server_id, but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed in delete mode without server_id"
